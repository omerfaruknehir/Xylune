name: Turkish UI static audit once
on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/turkish-ui-static-audit-once.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Extract likely user-visible static copy
        run: |
          python3 - <<'PY'
          import ast, re
          from pathlib import Path
          root = Path('app/src/main/java/app/xylune/chat/ui')
          coverage_files = [root/'UiStringResources.kt', root/'TurkishUiCopy.kt', root/'TurkishUiCopyExtra.kt', root/'TurkishUiCopyExtra2.kt', root/'TurkishUiCopyExtra3.kt']
          coverage='\n'.join(p.read_text() for p in coverage_files if p.exists())
          q = re.compile(r'(?s)(""".*?"""|"(?:\\.|[^"\\])*")')
          ui_markers = ('Text(', 'SettingsGroup(', 'SettingsSwitch(', 'SettingsDestination(', 'title =', 'subtitle =', 'label =', 'placeholder =', 'supportingText', 'contentDescription')
          skip_words = ('Regex(', 'UUID.', 'shader', 'uniform ', 'https://', 'http://', 'application/', 'content://', 'file://')
          rows=[]
          for path in sorted(root.glob('*.kt')):
              if path in coverage_files: continue
              text=path.read_text()
              for m in q.finditer(text):
                  raw=m.group(0)
                  try: value = raw[3:-3] if raw.startswith('"""') else ast.literal_eval(raw)
                  except Exception: continue
                  value=value.strip()
                  if not value or '$' in value or '${' in value or value in coverage: continue
                  if not re.search(r'[A-Za-z]{2,}', value): continue
                  if len(value)>500: continue
                  before=text[max(0,m.start()-420):m.start()]
                  if not any(marker in before for marker in ui_markers): continue
                  if any(s in before[-180:] or value.startswith(s) for s in skip_words): continue
                  if re.fullmatch(r'[A-Za-z0-9_.:+/-]+', value) and ' ' not in value:
                      # Keep human labels, drop obvious identifiers.
                      if value not in {'DETAILS','ERROR','INPUT','OUTPUT','SOURCE','QUERY','Activity','Planning','Researching','Blocked','Unreported','Cancelled','Balanced','Photos','Camera','Conversations','Images'}:
                          continue
                  line=text.count('\n',0,m.start())+1
                  rows.append(f'{path.name}:{line}: {value.replace(chr(10)," ↩ ")}')
          Path('translation-static-ui-audit.txt').write_text('# Likely user-visible static English not covered\n'+'\n'.join(sorted(set(rows)))+'\n')
          PY
      - name: Commit audit and remove workflow
        run: |
          rm .github/workflows/turkish-ui-static-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine static Turkish UI coverage audit'
          git push origin HEAD:agent/complete-turkish-localization
