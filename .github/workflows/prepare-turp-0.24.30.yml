name: Prepare Turp 0.24.30 release

on:
  push:
    branches: [feature/turp-arbor-theme]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/turp-arbor-theme
          fetch-depth: 0
      - name: Bump version and add bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'versionCode = 218' app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionName = \"0.24.29\"' app/build.gradle.kts)" -eq 1
          sed -i 's/versionCode = 218/versionCode = 219/' app/build.gradle.kts
          sed -i 's/versionName = "0.24.29"/versionName = "0.24.30"/' app/build.gradle.kts

          mkdir -p docs/releases/tr
          cat > docs/releases/RELEASE_NOTES_0.24.30.md <<'EOF'
          # Turp 0.24.30

          ## Turp and Arbor themes

          - Introduces Turp's proper radish-rooted Material palette with deep radish/crimson primary colors, leafy green secondary accents, warm root-toned tertiary accents, and coordinated light and dark surfaces.
          - Preserves the previous green Turp palette as the new selectable **Arbor** theme instead of discarding it.
          - Integrates Arbor across appearance settings, palette previews, launcher-theme matching, and dynamic launcher icon behavior.
          - Updates GitHub Pages so Turp and Arbor are distinct selectable color schemes with matching previews and dynamic logo palettes.
          - Adds regression coverage for the Turp/Arbor palette split and updates website integration tests accordingly.
          EOF

          cat > docs/releases/tr/RELEASE_NOTES_0.24.30.md <<'EOF'
          # Turp 0.24.30

          ## Turp ve Arbor temaları

          - Turp için koyu turp/kızıl ana renkler, yaprak yeşili ikincil vurgular, sıcak kök tonlu üçüncül vurgular ve uyumlu açık/koyu yüzeylerden oluşan gerçek turp temalı Material paletini ekler.
          - Önceki yeşil Turp paletini kaldırmak yerine yeni ve seçilebilir **Arbor** teması olarak korur.
          - Arbor'u görünüm ayarlarına, palet önizlemelerine, başlatıcı tema eşleştirmesine ve dinamik başlatıcı simgesi davranışına entegre eder.
          - GitHub Pages üzerinde Turp ve Arbor'u eşleşen önizlemeler ve dinamik logo paletleriyle ayrı seçilebilir renk şemaları hâline getirir.
          - Turp/Arbor palet ayrımı için regresyon kapsamı ekler ve web sitesi entegrasyon testlerini buna göre günceller.
          EOF

          grep -q 'versionCode = 219' app/build.gradle.kts
          grep -q 'versionName = "0.24.30"' app/build.gradle.kts
          test -s docs/releases/RELEASE_NOTES_0.24.30.md
          test -s docs/releases/tr/RELEASE_NOTES_0.24.30.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/build.gradle.kts docs/releases/RELEASE_NOTES_0.24.30.md docs/releases/tr/RELEASE_NOTES_0.24.30.md
          git commit -m 'release: prepare Turp 0.24.30'
          git push origin HEAD:feature/turp-arbor-theme
