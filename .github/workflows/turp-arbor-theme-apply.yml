name: Apply Turp and Arbor theme

on:
  push:
    branches:
      - feature/turp-arbor-theme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/turp-arbor-theme
          fetch-depth: 0

      - name: Apply theme migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # App palette identity.
          path = 'app/src/main/java/app/turp/chat/settings/AppPreferences.kt'
          text = read(path)
          text = replace_once(
              text,
              'enum class ColorPalette { TURP, SYSTEM, GRAPHITE, OCEAN, VIOLET, SUNSET }',
              'enum class ColorPalette { TURP, ARBOR, SYSTEM, GRAPHITE, OCEAN, VIOLET, SUNSET }',
              'ColorPalette enum',
          )
          write(path, text)

          # Material palettes: Turp becomes radish + leaf; the exact previous green Turp palette becomes Arbor.
          path = 'app/src/main/java/app/turp/chat/ui/theme/Theme.kt'
          text = read(path)
          pattern = re.compile(
              r'private val TurpLight = lightColorScheme\([\s\S]*?\n\)\n\nprivate val TurpDark = darkColorScheme\([\s\S]*?\n\)\n\nprivate val GraphiteLight',
          )
          replacement = '''private val TurpLight = lightColorScheme(
              primary = Color(0xFFA51D45), onPrimary = Color.White,
              primaryContainer = Color(0xFFFFD9E2), onPrimaryContainer = Color(0xFF3F0015),
              secondary = Color(0xFF4D6350), onSecondary = Color.White,
              secondaryContainer = Color(0xFFD0E8D0), onSecondaryContainer = Color(0xFF0B1F10),
              tertiary = Color(0xFF6B5E2E), onTertiary = Color.White,
              tertiaryContainer = Color(0xFFF4E2A8), onTertiaryContainer = Color(0xFF211B00),
              background = Color(0xFFFFF8F7), onBackground = Color(0xFF23191C),
              surface = Color(0xFFFFF8F7), onSurface = Color(0xFF23191C),
              surfaceVariant = Color(0xFFF1DEE2), onSurfaceVariant = Color(0xFF514347),
              outline = Color(0xFF837377), outlineVariant = Color(0xFFD5C2C6),
              surfaceContainerLowest = Color.White, surfaceContainerLow = Color(0xFFFFF0F2),
              surfaceContainer = Color(0xFFF9EAED), surfaceContainerHigh = Color(0xFFF3E4E7),
              surfaceContainerHighest = Color(0xFFEDE0E2),
              inverseSurface = Color(0xFF382E31), inverseOnSurface = Color(0xFFFFECEF), inversePrimary = Color(0xFFFFB1C5),
              error = Color(0xFFBA1A1A), errorContainer = Color(0xFFFFDAD6), onErrorContainer = Color(0xFF410002),
          )

          private val TurpDark = darkColorScheme(
              primary = Color(0xFFFFB1C5), onPrimary = Color(0xFF650026),
              primaryContainer = Color(0xFF851334), onPrimaryContainer = Color(0xFFFFD9E2),
              secondary = Color(0xFFB5CCB6), onSecondary = Color(0xFF203523),
              secondaryContainer = Color(0xFF374B3A), onSecondaryContainer = Color(0xFFD0E8D0),
              tertiary = Color(0xFFD8C68B), onTertiary = Color(0xFF393005),
              tertiaryContainer = Color(0xFF514718), onTertiaryContainer = Color(0xFFF4E2A8),
              background = Color(0xFF1A1114), onBackground = Color(0xFFF1DEE2),
              surface = Color(0xFF1A1114), onSurface = Color(0xFFF1DEE2),
              surfaceVariant = Color(0xFF514347), onSurfaceVariant = Color(0xFFD5C2C6),
              outline = Color(0xFF9E8C91), outlineVariant = Color(0xFF514347),
              surfaceContainerLowest = Color(0xFF140C0F), surfaceContainerLow = Color(0xFF23191C),
              surfaceContainer = Color(0xFF271D20), surfaceContainerHigh = Color(0xFF31272A),
              surfaceContainerHighest = Color(0xFF3C3135),
              inverseSurface = Color(0xFFF1DEE2), inverseOnSurface = Color(0xFF382E31), inversePrimary = Color(0xFFA51D45),
              error = Color(0xFFFFB4AB), errorContainer = Color(0xFF93000A), onErrorContainer = Color(0xFFFFDAD6),
          )

          private val ArborLight = lightColorScheme(
              primary = Color(0xFF286448), onPrimary = Color.White,
              primaryContainer = Color(0xFFB5F1CC), onPrimaryContainer = Color(0xFF002112),
              secondary = Color(0xFF4E6356), onSecondary = Color.White,
              secondaryContainer = Color(0xFFD1E8D7), onSecondaryContainer = Color(0xFF0B1F14),
              tertiary = Color(0xFF3D6472), onTertiary = Color.White,
              tertiaryContainer = Color(0xFFC1EAFB), onTertiaryContainer = Color(0xFF001F29),
              background = Color(0xFFF7FAF7), onBackground = Color(0xFF181D1A),
              surface = Color(0xFFF7FAF7), onSurface = Color(0xFF181D1A),
              surfaceVariant = Color(0xFFDDE5DE), onSurfaceVariant = Color(0xFF414942),
              outline = Color(0xFF717972), outlineVariant = Color(0xFFC1C9C2),
              surfaceContainerLowest = Color.White, surfaceContainerLow = Color(0xFFF1F4F1),
              surfaceContainer = Color(0xFFEBEEEB), surfaceContainerHigh = Color(0xFFE5E9E5),
              surfaceContainerHighest = Color(0xFFDFE3DF),
              inverseSurface = Color(0xFF2E3036), inverseOnSurface = Color(0xFFF0F0F7), inversePrimary = Color(0xFF99D5B1),
              error = Color(0xFFBA1A1A), errorContainer = Color(0xFFFFDAD6), onErrorContainer = Color(0xFF410002),
          )

          private val ArborDark = darkColorScheme(
              primary = Color(0xFF99D5B1), onPrimary = Color(0xFF003921),
              primaryContainer = Color(0xFF0D5033), onPrimaryContainer = Color(0xFFB5F1CC),
              secondary = Color(0xFFB5CCBC), onSecondary = Color(0xFF213529),
              secondaryContainer = Color(0xFF374B3E), onSecondaryContainer = Color(0xFFD1E8D7),
              tertiary = Color(0xFFA5CDDD), onTertiary = Color(0xFF073541),
              tertiaryContainer = Color(0xFF254C59), onTertiaryContainer = Color(0xFFC1EAFB),
              background = Color(0xFF101411), onBackground = Color(0xFFDFE4DF),
              surface = Color(0xFF101411), onSurface = Color(0xFFDFE4DF),
              surfaceVariant = Color(0xFF414942), onSurfaceVariant = Color(0xFFC1C9C2),
              outline = Color(0xFF8B938C), outlineVariant = Color(0xFF414942),
              surfaceContainerLowest = Color(0xFF0B0F0C), surfaceContainerLow = Color(0xFF181C19),
              surfaceContainer = Color(0xFF1C201D), surfaceContainerHigh = Color(0xFF262A27),
              surfaceContainerHighest = Color(0xFF313532),
              inverseSurface = Color(0xFFE2E2E9), inverseOnSurface = Color(0xFF2E3036), inversePrimary = Color(0xFF286448),
              error = Color(0xFFFFB4AB), errorContainer = Color(0xFF93000A), onErrorContainer = Color(0xFFFFDAD6),
          )

          private val GraphiteLight'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Theme base block: expected 1 match, found {count}')
          for name in ('Graphite', 'Ocean', 'Violet', 'Sunset'):
              text = text.replace(f'private val {name}Light = TurpLight.copy', f'private val {name}Light = ArborLight.copy')
              text = text.replace(f'private val {name}Dark = TurpDark.copy', f'private val {name}Dark = ArborDark.copy')
          text = replace_once(
              text,
              '    ColorPalette.TURP -> if (dark) TurpDark else TurpLight\n    ColorPalette.GRAPHITE',
              '    ColorPalette.TURP -> if (dark) TurpDark else TurpLight\n    ColorPalette.ARBOR -> if (dark) ArborDark else ArborLight\n    ColorPalette.GRAPHITE',
              'Theme palette switch',
          )
          write(path, text)

          # Appearance copy.
          path = 'app/src/main/java/app/turp/chat/ui/SettingsScreen.kt'
          text = read(path)
          text = replace_once(
              text,
              '        ColorPalette.TURP -> "Turp"\n        ColorPalette.SYSTEM -> "Dynamic"',
              '        ColorPalette.TURP -> "Turp"\n        ColorPalette.ARBOR -> "Arbor"\n        ColorPalette.SYSTEM -> "Dynamic"',
              'Palette label',
          )
          text = replace_once(
              text,
              '        ColorPalette.TURP -> "Turp\'s natural green Material palette"\n        ColorPalette.SYSTEM -> "Colors generated from your wallpaper on Android 12+"',
              '        ColorPalette.TURP -> "Radish red, leafy green, and warm root-toned surfaces"\n        ColorPalette.ARBOR -> "The original natural green Turp palette"\n        ColorPalette.SYSTEM -> "Colors generated from your wallpaper on Android 12+"',
              'Palette description',
          )
          write(path, text)

          # In-app logo preview remains the canonical radish artwork for Arbor too.
          path = 'app/src/main/java/app/turp/chat/ui/PaletteVisuals.kt'
          text = read(path)
          text = replace_once(
              text,
              '        ColorPalette.TURP -> R.drawable.ic_turp_mark\n        ColorPalette.SYSTEM',
              '        ColorPalette.TURP -> R.drawable.ic_turp_mark\n        ColorPalette.ARBOR -> R.drawable.ic_turp_mark\n        ColorPalette.SYSTEM',
              'Launcher preview palette',
          )
          write(path, text)

          # Give Arbor a stable launcher alias while intentionally sharing the canonical radish art.
          path = 'app/src/main/java/app/turp/chat/settings/LauncherIconManager.kt'
          text = read(path)
          text = replace_once(
              text,
              '    internal const val TURP_ALIAS = "app.turp.chat.LauncherTurp"\n    internal const val SYSTEM_ALIAS',
              '    internal const val TURP_ALIAS = "app.turp.chat.LauncherTurp"\n    internal const val ARBOR_ALIAS = "app.turp.chat.LauncherArbor"\n    internal const val SYSTEM_ALIAS',
              'Arbor launcher alias constant',
          )
          text = replace_once(
              text,
              '        TURP_ALIAS,\n        SYSTEM_ALIAS,',
              '        TURP_ALIAS,\n        ARBOR_ALIAS,\n        SYSTEM_ALIAS,',
              'Arbor allAliases',
          )
          text = replace_once(
              text,
              '            ColorPalette.TURP -> TURP_ALIAS\n            ColorPalette.SYSTEM',
              '            ColorPalette.TURP -> TURP_ALIAS\n            ColorPalette.ARBOR -> ARBOR_ALIAS\n            ColorPalette.SYSTEM',
              'Arbor alias switch',
          )
          text = replace_once(
              text,
              '        when (aliasClassName(matchPalette, palette)) {\n            SYSTEM_ALIAS ->',
              '        when (aliasClassName(matchPalette, palette)) {\n            ARBOR_ALIAS -> R.mipmap.ic_launcher\n            SYSTEM_ALIAS ->',
              'Arbor icon resource',
          )
          write(path, text)

          path = 'app/src/main/AndroidManifest.xml'
          text = read(path)
          arbor_alias = '''
          <activity-alias
              android:name=".LauncherArbor"
              android:enabled="false"
              android:exported="true"
              android:icon="@mipmap/ic_launcher"
              android:label="@string/app_name"
              android:targetActivity=".LauncherTurpActivity">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
          </activity-alias>

          '''
          anchor = '        <activity-alias\n            android:name=".LauncherSystem"'
          text = replace_once(text, anchor, arbor_alias + anchor, 'Arbor manifest alias')
          write(path, text)

          path = 'app/src/test/java/app/turp/chat/settings/LauncherIconManagerTest.kt'
          text = read(path)
          text = replace_once(
              text,
              '            ".LauncherTurpActivity",\n            ".LauncherSystemActivity",',
              '            ".LauncherTurpActivity",\n            ".LauncherTurpActivity",\n            ".LauncherSystemActivity",',
              'Arbor launcher test target',
          )
          write(path, text)

          # GitHub Pages: preserve the original green variables as Arbor and make Turp match the radish brand.
          path = 'docs/assets/js/theme-boot.js'
          text = read(path)
          turp_accents = '''    turp: {
              dark: {
                '--primary': '#ffb1c5', '--on-primary': '#650026',
                '--primary-container': '#851334', '--on-primary-container': '#ffd9e2',
                '--secondary': '#b5ccb6', '--on-secondary': '#203523',
                '--secondary-container': '#374b3a', '--on-secondary-container': '#d0e8d0',
                '--tertiary': '#d8c68b', '--on-tertiary': '#393005',
                '--tertiary-container': '#514718', '--on-tertiary-container': '#f4e2a8',
              },
              light: {
                '--primary': '#a51d45', '--on-primary': '#ffffff',
                '--primary-container': '#ffd9e2', '--on-primary-container': '#3f0015',
                '--secondary': '#4d6350', '--on-secondary': '#ffffff',
                '--secondary-container': '#d0e8d0', '--on-secondary-container': '#0b1f10',
                '--tertiary': '#6b5e2e', '--on-tertiary': '#ffffff',
                '--tertiary-container': '#f4e2a8', '--on-tertiary-container': '#211b00',
              },
            },
            arbor: { dark: {}, light: {} },'''
          text = replace_once(
              text,
              '    turp: { dark: {}, light: {} },\n    graphite:',
              turp_accents + '\n    graphite:',
              'Pages Turp accents',
          )
          turp_surfaces = '''    turp: {
              dark: {
                '--background': '#1a1114', '--surface': '#1a1114', '--surface-low': '#23191c',
                '--surface-container': '#271d20', '--on-surface': '#f1dee2',
                '--on-surface-variant': '#d5c2c6', '--outline': '#9e8c91',
                '--outline-variant': '#514347', '--rail': '#140c0f',
              },
              light: {
                '--background': '#fff8f7', '--surface': '#fff8f7', '--surface-low': '#fff0f2',
                '--surface-container': '#f9eaed', '--on-surface': '#23191c',
                '--on-surface-variant': '#514347', '--outline': '#837377',
                '--outline-variant': '#d5c2c6', '--rail': '#ffffff',
              },
            },
            arbor: { dark: {}, light: {} },'''
          text = replace_once(
              text,
              '    turp: { dark: {}, light: {} },\n    graphite:',
              turp_surfaces + '\n    graphite:',
              'Pages Turp surfaces',
          )
          text = replace_once(
              text,
              "  const supportedSchemes = ['app', 'turp', 'graphite', 'ocean', 'violet', 'sunset'];",
              "  const supportedSchemes = ['app', 'turp', 'arbor', 'graphite', 'ocean', 'violet', 'sunset'];",
              'Pages supported schemes',
          )
          write(path, text)

          path = 'docs/assets/css/appearance.css'
          text = read(path)
          text = replace_once(
              text,
              '  --preview-primary: #99d5b1;\n  --preview-secondary: #b5ccbc;\n  --preview-tertiary: #a5cddd;',
              '  --preview-primary: #ffb1c5;\n  --preview-secondary: #b5ccb6;\n  --preview-tertiary: #d8c68b;',
              'Default Turp palette swatch',
          )
          insert = '''
          .palette-choice[data-scheme-choice='turp'] {
            --preview-primary: #ffb1c5;
            --preview-secondary: #b5ccb6;
            --preview-tertiary: #d8c68b;
          }

          .palette-choice[data-scheme-choice='arbor'] {
            --preview-primary: #99d5b1;
            --preview-secondary: #b5ccbc;
            --preview-tertiary: #a5cddd;
          }

          '''
          anchor = ".palette-choice[data-scheme-choice='graphite'] {"
          text = replace_once(text, anchor, insert + anchor, 'Pages Arbor swatch')
          write(path, text)

          path = 'docs/assets/js/i18n.js'
          text = read(path)
          text = replace_once(
              text,
              "      turp: 'Turp',\n      graphite: ui.graphite,",
              "      turp: 'Turp',\n      arbor: 'Arbor',\n      graphite: ui.graphite,",
              'Pages Arbor label',
          )
          write(path, text)

          path = 'docs/assets/js/site.js'
          text = read(path)
          text = replace_once(
              text,
              "    supportedSchemes: ['app', 'turp'],",
              "    supportedSchemes: ['app', 'turp', 'arbor'],",
              'Pages fallback schemes',
          )
          arbor_icon = '''    arbor: {
              backgroundStart: '#e7f4ea',
              backgroundEnd: '#b5f1cc',
              markStart: '#286448',
              markEnd: '#0d5033',
              leaf: '#3d6472',
              secondStroke: '#c1eafb',
            },
            '''
          text = replace_once(
              text,
              '    system: {',
              arbor_icon + 'system: {',
              'Pages Arbor icon palette',
          )
          text = replace_once(
              text,
              "    ['#286448', 'turp'],\n    ['#99d5b1', 'turp'],",
              "    ['#a51d45', 'turp'],\n    ['#ffb1c5', 'turp'],\n    ['#286448', 'arbor'],\n    ['#99d5b1', 'arbor'],",
              'Pages app primary mapping',
          )
          text = replace_once(
              text,
              "          ${schemeButton('turp', 'Turp', false, true)}\n          ${schemeButton('graphite', 'Graphite', false, true)}",
              "          ${schemeButton('turp', 'Turp', false, true)}\n          ${schemeButton('arbor', 'Arbor', false, true)}\n          ${schemeButton('graphite', 'Graphite', false, true)}",
              'Pages Arbor scheme button',
          )
          write(path, text)

          # Permanent regression coverage for the brand split.
          test_path = Path('app/src/test/java/app/turp/chat/ui/ThemePaletteRegressionTest.kt')
          test_path.write_text('''package app.turp.chat.ui

          import java.io.File
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ThemePaletteRegressionTest {
              @Test
              fun `Turp is radish themed and Arbor preserves the original green palette`() {
                  val theme = File("src/main/java/app/turp/chat/ui/theme/Theme.kt").readText()
                  val preferences = File("src/main/java/app/turp/chat/settings/AppPreferences.kt").readText()
                  val settings = File("src/main/java/app/turp/chat/ui/SettingsScreen.kt").readText()

                  assertTrue(preferences.contains("TURP, ARBOR, SYSTEM"))
                  assertTrue(theme.contains("private val TurpLight"))
                  assertTrue(theme.contains("primary = Color(0xFFA51D45)"))
                  assertTrue(theme.contains("primary = Color(0xFFFFB1C5)"))
                  assertTrue(theme.contains("private val ArborLight"))
                  assertTrue(theme.contains("primary = Color(0xFF286448)"))
                  assertTrue(theme.contains("private val ArborDark"))
                  assertTrue(theme.contains("primary = Color(0xFF99D5B1)"))
                  assertTrue(settings.contains("ColorPalette.ARBOR -> \"Arbor\""))
              }
          }
          ''')

          # Sanity assertions before committing.
          checks = {
              'app enum': 'ColorPalette { TURP, ARBOR, SYSTEM',
              'Turp red': 'primary = Color(0xFFA51D45)',
              'Arbor green': 'private val ArborLight',
              'Pages Arbor': "arbor: { dark: {}, light: {} }",
              'Pages button': "schemeButton('arbor', 'Arbor'",
          }
          combined = '\n'.join(read(p) for p in [
              'app/src/main/java/app/turp/chat/settings/AppPreferences.kt',
              'app/src/main/java/app/turp/chat/ui/theme/Theme.kt',
              'docs/assets/js/theme-boot.js',
              'docs/assets/js/site.js',
          ])
          for label, needle in checks.items():
              if needle not in combined:
                  raise SystemExit(f'Missing sanity check: {label}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/app/turp/chat/settings/AppPreferences.kt \
            app/src/main/java/app/turp/chat/ui/theme/Theme.kt \
            app/src/main/java/app/turp/chat/ui/SettingsScreen.kt \
            app/src/main/java/app/turp/chat/ui/PaletteVisuals.kt \
            app/src/main/java/app/turp/chat/settings/LauncherIconManager.kt \
            app/src/main/AndroidManifest.xml \
            app/src/test/java/app/turp/chat/settings/LauncherIconManagerTest.kt \
            app/src/test/java/app/turp/chat/ui/ThemePaletteRegressionTest.kt \
            docs/assets/js/theme-boot.js \
            docs/assets/css/appearance.css \
            docs/assets/js/i18n.js \
            docs/assets/js/site.js
          git diff --cached --check
          git commit -m "[theme-bot] Add Turp and Arbor themes"
          git push origin HEAD:feature/turp-arbor-theme
