name: Fix Turkish dynamic rule order once
on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/fix-turkish-dynamic-rule-order-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Prefer model-search phrase before provider-model fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/xylune/chat/ui/TurkishDynamicUiCopy.kt')
          s=p.read_text()
          generic='''        Regex("""(.+) models""").matchEntire(text)?.let { return "${it.groupValues[1]} modelleri" }\n'''
          specific='''        Regex("""Search (\\d+) models""").matchEntire(text)?.let { return "${it.groupValues[1]} modelde ara" }\n'''
          if generic not in s or specific not in s:
              raise SystemExit('expected model rules not found')
          s=s.replace(generic, '', 1)
          # Keep the provider-name fallback directly after the specific search rule.
          s=s.replace(specific, specific + '''        Regex("""(.+) models""").matchEntire(text)?.let {\n            val prefix = it.groupValues[1]\n            if (prefix != "Search" && prefix.toIntOrNull() == null) return "$prefix modelleri"\n        }\n''', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-turkish-dynamic-rule-order-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Narrow Turkish dynamic model translation rules'
          git push origin HEAD:agent/complete-turkish-localization
