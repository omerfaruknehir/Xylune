name: One-shot UI localization migration

on:
  push:
    branches:
      - agent/fix-source-preview-turkish-localization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-source-preview-turkish-localization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Route UI text through the locale facade
        run: python .github/scripts/localize_ui_once.py
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/xylune/chat/ui tools/xylune-ui-literals.txt
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Route Compose UI text through app localization"
          git push origin HEAD:agent/fix-source-preview-turkish-localization
