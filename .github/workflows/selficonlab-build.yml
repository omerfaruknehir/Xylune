name: Build Self-Updating Icon Lab

on:
  push:
    branches: [icon-self-update-v3]
    paths:
      - 'selficonlab/**'
      - '.github/workflows/selficonlab-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-self-update-v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable self-signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selficonlab/signing selficonlab/app/src/main/assets selficonlab-dist
          if [ -f selficonlab-dist/selfsign.p12 ]; then
            cp selficonlab-dist/selfsign.p12 selficonlab/signing/selfsign.p12
          else
            keytool -genkeypair \
              -alias iconlab \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname 'CN=Icon Lab Self Update, O=Test Only, C=TR' \
              -storetype PKCS12 \
              -keystore selficonlab/signing/selfsign.p12 \
              -storepass iconlab-test-only \
              -keypass iconlab-test-only \
              -noprompt
          fi
          cp selficonlab/signing/selfsign.p12 selficonlab/app/src/main/assets/selfsign.p12

      - name: Generate initial adaptive foreground PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selficonlab/app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          import struct, zlib
          W=H=432
          rows=[]
          for y in range(H):
              row=bytearray([0])
              for x in range(W):
                  dx=(x-W/2)/(W/2); dy=(y-H/2)/(H/2)
                  r2=dx*dx+dy*dy
                  if r2 < 0.58:
                      rgba=(126,82,113,255)
                  elif r2 < 0.72:
                      rgba=(214,180,203,255)
                  else:
                      rgba=(0,0,0,0)
                  row.extend(rgba)
              rows.append(bytes(row))
          raw=b''.join(rows)
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('selficonlab/app/src/main/res/mipmap-xxxhdpi/icon_foreground.png','wb').write(png)
          PY

      - name: Build APK
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew -p selficonlab :app:assembleDebug --stacktrace > /tmp/selficonlab-build.log 2>&1
          code=$?
          set -e
          cat /tmp/selficonlab-build.log
          mkdir -p selficonlab-dist
          cp /tmp/selficonlab-build.log selficonlab-dist/build.log
          printf 'result=%s\nsource=%s\nrun=%s\n' "$([ "$code" = 0 ] && echo success || echo failure)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > selficonlab-dist/status.txt
          if [ "$code" = 0 ]; then
            cp selficonlab/app/build/outputs/apk/debug/app-debug.apk selficonlab-dist/IconLab-self-update-debug.apk
            cp selficonlab/signing/selfsign.p12 selficonlab-dist/selfsign.p12
          fi
          exit "$code"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: icon-lab-self-update-apk
          path: selficonlab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish build result to branch
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f selficonlab-dist/status.txt selficonlab-dist/build.log
          if [ -f selficonlab-dist/IconLab-self-update-debug.apk ]; then
            git add -f selficonlab-dist/IconLab-self-update-debug.apk selficonlab-dist/selfsign.p12
          fi
          git commit -m 'Publish self Icon Lab build result' || exit 0
          git push origin HEAD:icon-self-update-v3
