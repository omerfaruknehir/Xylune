name: Turkish localization audit once

on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/turkish-localization-audit-once.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Inventory untranslated Xylune UI literals
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          root = Path('app/src/main/java/app/xylune/chat/ui')
          coverage_paths = [
              root / 'UiStringResources.kt',
              root / 'TurkishUiCopy.kt',
              root / 'TurkishUiCopyExtra.kt',
              root / 'TurkishUiCopyExtra2.kt',
              root / 'TurkishUiCopyExtra3.kt',
          ]
          coverage = '\n'.join(p.read_text() for p in coverage_paths if p.exists())

          # Kotlin string literal extractor good enough for UI copy inventory.
          quoted = re.compile(r'(?s)(""".*?"""|"(?:\\.|[^"\\])*")')
          human = re.compile(r'[A-Za-z]{2,}')
          ignore_exact = {
              'Back',  # content descriptions can be translated separately; already covered
              'SettingsPageNavigation',
          }
          ignore_prefixes = (
              'http://', 'https://', 'content://', 'file://', 'application/', 'text/', 'image/',
              'android.', 'app.xylune.', 'com.', 'org.', 'io.', 'dev.', 'BuildConfig.',
          )
          rows = []
          templates = []
          for path in sorted(root.glob('*.kt')):
              if path.name in {p.name for p in coverage_paths}:
                  continue
              text = path.read_text()
              for m in quoted.finditer(text):
                  raw = m.group(0)
                  if raw.startswith('"""'):
                      value = raw[3:-3]
                  else:
                      try:
                          value = ast.literal_eval(raw)
                      except Exception:
                          value = raw[1:-1]
                  value = value.strip('\n')
                  if not value or value in ignore_exact or not human.search(value):
                      continue
                  if value.startswith(ignore_prefixes):
                      continue
                  # Skip obvious identifiers / model IDs / regexes / format-only strings.
                  if (' ' not in value and value.lower() == value and re.fullmatch(r'[a-z0-9_.:/+{}$\\-]+', value)):
                      continue
                  line = text.count('\n', 0, m.start()) + 1
                  record = f'{path.name}:{line}: {value.replace(chr(10), " ↩ ")}'
                  if '${' in value or '$' in value:
                      templates.append(record)
                  if value not in coverage:
                      rows.append(record)

          report = [
              '# Turkish localization source audit',
              '',
              '## Literal/template strings not represented by the static resource bridge or compatibility translators',
              *sorted(set(rows)),
              '',
              '## All Kotlin string templates in UI files (manual dynamic-translation review)',
              *sorted(set(templates)),
              '',
          ]
          Path('translation-audit.txt').write_text('\n'.join(report) + '\n')
          PY
          git diff --check
      - name: Commit audit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/turkish-localization-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Inventory remaining Turkish localization gaps'
          git push origin HEAD:agent/complete-turkish-localization
