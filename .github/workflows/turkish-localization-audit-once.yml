name: Finalize Turkish release through registered workflow

on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/turkish-localization-audit-once.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Execute staged release finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/finalize-turkish-release-once.yml').read_text()
          source = source.replace(
              "              ('contentDescription = \\\"Clear search\\\"', 'contentDescription = localizedXyluneUiText(\\\"Clear search\\\")'),",
              "              ('Icon(Icons.Outlined.Clear, \\\"Clear search\\\")', 'Icon(Icons.Outlined.Clear, localizedXyluneUiText(\\\"Clear search\\\"))'),",
          ).replace(
              "              ('contentDescription = \\\"Inspect repair\\\"', 'contentDescription = localizedXyluneUiText(\\\"Inspect repair\\\")'),",
              "              ('Icon(Icons.Outlined.Edit, \\\"Inspect repair\\\")', 'Icon(Icons.Outlined.Edit, localizedXyluneUiText(\\\"Inspect repair\\\"))'),",
          )
          marker = '      - name: Finalize Turkish UI coverage and release metadata\n        shell: bash\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('      - name: Commit finalized release branch\n', start)
          lines = source[start:end].splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/xylune-finalize-turkish.sh').write_text(body)
          PY
          bash /tmp/xylune-finalize-turkish.sh
          rm -f .github/workflows/turkish-localization-audit-once.yml
          git diff --check
      - name: Commit finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Turkish localization and prepare 0.24.27'
          git push origin HEAD:agent/complete-turkish-localization
