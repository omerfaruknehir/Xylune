name: Finalize Turp and Arbor theme

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/turp-arbor-theme
          fetch-depth: 0

      - name: Update website regression for Arbor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/app/turp/chat/ui/LegalWebsiteIntegrationTest.kt')
          text = path.read_text()
          old = "supportedSchemes = ['app', 'turp', 'graphite', 'ocean', 'violet', 'sunset']"
          new = "supportedSchemes = ['app', 'turp', 'arbor', 'graphite', 'ocean', 'violet', 'sunset']"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not locate supported scheme assertion')

          old_button = '        assertTrue(site.contains("schemeButton(\'graphite\', \'Graphite\'"))'
          arbor_button = '        assertTrue(site.contains("schemeButton(\'arbor\', \'Arbor\'"))\n' + old_button
          if "schemeButton('arbor', 'Arbor'" not in text:
              if old_button not in text:
                  raise SystemExit('Could not locate scheme button assertion')
              text = text.replace(old_button, arbor_button, 1)

          path.write_text(text)
          PY

          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/test/java/app/turp/chat/ui/LegalWebsiteIntegrationTest.kt
          git commit -m 'test: include Arbor in website theme regression'
          git push origin HEAD:feature/turp-arbor-theme
