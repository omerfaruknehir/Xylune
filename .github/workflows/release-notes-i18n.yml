name: Sync bilingual release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-notes-i18n.yml'
      - '.github/scripts/compose-release-notes.sh'
      - 'docs/releases/RELEASE_NOTES_*.md'
      - 'docs/releases/tr/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-i18n
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate and sync the latest 10 published releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' | head -n 10
          )

          [[ ${#tags[@]} -gt 0 ]]
          for tag in "${tags[@]}"; do
            version="${tag#v}"
            english="docs/releases/RELEASE_NOTES_${version}.md"
            turkish="docs/releases/tr/RELEASE_NOTES_${version}.md"

            if [[ ! -s "$english" || ! -s "$turkish" ]]; then
              echo "Missing bilingual source notes for $tag:" >&2
              echo "  $english" >&2
              echo "  $turkish" >&2
              exit 1
            fi

            notes="$(bash .github/scripts/compose-release-notes.sh "$version")"
            test -s "$notes"
            grep -q '<!-- xylune-release-notes:en -->' "$notes"
            grep -q '<!-- xylune-release-notes:tr -->' "$notes"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            echo "Synchronized $tag"
          done
