name: One-shot Turkish catalog split

on:
  push:
    branches:
      - agent/fix-source-preview-turkish-localization

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-source-preview-turkish-localization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Split translation lookup bytecode
        run: python .github/scripts/split_turkish_catalogs.py
      - name: Commit transformed catalogs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/xylune/chat/ui/TurkishUiCopy*.kt
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Split Turkish translation lookup tables"
          git push origin HEAD:agent/fix-source-preview-turkish-localization
