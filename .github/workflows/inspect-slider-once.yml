name: Inspect slider source once

on:
  push:
    branches:
      - agent/fix-thinking-slider-localization

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture XyluneSlider source
        shell: bash
        run: |
          set -euo pipefail
          path="$(grep -R -l --include='*.kt' 'fun XyluneSlider' app/src/main/java | head -n 1)"
          test -n "$path"
          {
            printf 'PATH=%s\n\n' "$path"
            cat "$path"
          } > .xylune-slider-source.txt
          rm -f .github/workflows/inspect-slider-once.yml

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xylune-inspection[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture slider source for focused fix"
          git push origin HEAD:agent/fix-thinking-slider-localization
