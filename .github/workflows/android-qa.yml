name: Android QA Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'ci/android-emulator-qa.sh'
      - '.github/workflows/android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ./ci/android-emulator-qa.sh
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xylune-android-emulator-qa
          if-no-files-found: warn
          retention-days: 7
          path: qa-artifacts/
