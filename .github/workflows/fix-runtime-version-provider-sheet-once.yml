name: Apply runtime version and provider sheet fixes once

on:
  push:
    branches: [agent/fix-runtime-version-provider-sheet]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-runtime-version-provider-sheet
          fetch-depth: 0
      - name: Patch app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          app_version = root / 'app/src/main/java/app/xylune/chat/AppVersion.kt'
          app_version.write_text(r'''package app.xylune.chat

import android.content.Context
import android.content.pm.PackageManager
import android.os.Build

data class InstalledAppVersion(
    val versionName: String,
    val versionCode: Int,
)

/**
 * Returns the version Android says is actually installed for this package.
 *
 * Runtime UI/update/export metadata should use PackageManager rather than a
 * generated build constant so sideloaded, restored, or differently packaged
 * builds always identify themselves using their manifest/package metadata.
 */
fun Context.installedAppVersion(): InstalledAppVersion {
    val packageInfo = runCatching {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            packageManager.getPackageInfo(
                packageName,
                PackageManager.PackageInfoFlags.of(0),
            )
        } else {
            @Suppress("DEPRECATION")
            packageManager.getPackageInfo(packageName, 0)
        }
    }.getOrNull()

    val versionName = packageInfo?.versionName
        ?.trim()
        ?.takeIf(String::isNotEmpty)
        ?: BuildConfig.VERSION_NAME
    val versionCode = when {
        packageInfo == null -> BuildConfig.VERSION_CODE
        Build.VERSION.SDK_INT >= Build.VERSION_CODES.P ->
            packageInfo.longVersionCode.coerceIn(0L, Int.MAX_VALUE.toLong()).toInt()
        else -> {
            @Suppress("DEPRECATION")
            packageInfo.versionCode
        }
    }
    return InstalledAppVersion(versionName, versionCode)
}
''')

          def replace_once(path: str, old: str, new: str):
              p = root / path
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          path = 'app/src/main/java/app/xylune/chat/update/RepositoryUpdateManager.kt'
          replace_once(path,
              'import app.xylune.chat.BuildConfig\n',
              'import app.xylune.chat.BuildConfig\nimport app.xylune.chat.installedAppVersion\n')
          replace_once(path,
              '    private val preferences = appContext.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE)\n    private val repository = normalizeGitHubRepository(BuildConfig.SOURCE_REPOSITORY)\n',
              '    private val preferences = appContext.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE)\n    private val installedVersion = appContext.installedAppVersion()\n    private val repository = normalizeGitHubRepository(BuildConfig.SOURCE_REPOSITORY)\n')
          replace_once(path,
              '                        currentVersion = BuildConfig.VERSION_NAME,\n                        candidateVersionCode = release.versionCode,\n                        currentVersionCode = BuildConfig.VERSION_CODE,\n',
              '                        currentVersion = installedVersion.versionName,\n                        candidateVersionCode = release.versionCode,\n                        currentVersionCode = installedVersion.versionCode,\n')
          replace_once(path,
              '            .header("User-Agent", "Xylune/${BuildConfig.VERSION_NAME} (${BuildConfig.APPLICATION_ID})")\n',
              '            .header("User-Agent", "Xylune/${installedVersion.versionName} (${appContext.packageName})")\n')

          path = 'app/src/main/java/app/xylune/chat/transfer/XyluneArchiveManager.kt'
          replace_once(path,
              'import app.xylune.chat.BuildConfig\n',
              'import app.xylune.chat.installedAppVersion\n')
          replace_once(path,
              '    private val json = Json {\n',
              '    private val installedVersion = context.installedAppVersion()\n    private val json = Json {\n')
          replace_once(path,
              '                appVersion = BuildConfig.VERSION_NAME,\n',
              '                appVersion = installedVersion.versionName,\n')

          path = 'app/src/main/java/app/xylune/chat/ui/SettingsScreen.kt'
          replace_once(path,
              'import androidx.compose.foundation.layout.Box\n',
              'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n')
          replace_once(path,
              'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\n',
              'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxHeight\nimport androidx.compose.foundation.layout.fillMaxWidth\n')
          replace_once(path,
              'import androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.padding\n',
              'import androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.imePadding\nimport androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.padding\n')
          replace_once(path,
              'import androidx.compose.material3.rememberTopAppBarState\n',
              'import androidx.compose.material3.rememberModalBottomSheetState\nimport androidx.compose.material3.rememberTopAppBarState\n')
          replace_once(path,
              'import app.xylune.chat.R\n',
              'import app.xylune.chat.R\nimport app.xylune.chat.installedAppVersion\n')

          replace_once(path,
              '    val appName = stringResource(R.string.app_name)\n    val applicationInfo = LocalContext.current.applicationInfo\n    val uriHandler = LocalUriHandler.current\n',
              '    val appName = stringResource(R.string.app_name)\n    val context = LocalContext.current\n    val applicationInfo = context.applicationInfo\n    val installedVersion = remember(context) { context.installedAppVersion() }\n    val uriHandler = LocalUriHandler.current\n')
          replace_once(path,
              '    SectionTitle("$appName ${BuildConfig.VERSION_NAME}", "Native Android BYOK model workspace.")\n',
              '    SectionTitle("$appName ${installedVersion.versionName}", "Native Android BYOK model workspace.")\n')
          replace_once(path,
              '        AboutInfoRow("Version", BuildConfig.VERSION_NAME)\n        AboutInfoRow("Build", "${BuildConfig.VERSION_CODE} · ${BuildConfig.BUILD_TYPE}")\n',
              '        AboutInfoRow("Version", installedVersion.versionName)\n        AboutInfoRow("Build", "${installedVersion.versionCode} · ${BuildConfig.BUILD_TYPE}")\n')

          replace_once(path,
              '''    XyluneAlertDialog(\n        onDismissRequest = onDismiss,\n        title = { Text("Add provider") },\n        text = {\n            Column(\n                Modifier.heightIn(max = 590.dp).verticalScroll(rememberScrollState()),\n                verticalArrangement = Arrangement.spacedBy(10.dp),\n            ) {\n''',
              '''    val sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)\n    val formScrollState = rememberScrollState()\n\n    fun submitProvider() {\n        val selected = discoveredModels.filter { it.id in selectedModelIds }\n        val manual = if (manualModelReady) {\n            listOf(DiscoveredModel(manualModelId, manualModelName.trim()))\n        } else {\n            emptyList()\n        }\n        onAdd(\n            ProviderDraft(\n                templateProviderId = templateId,\n                name = name.trim(),\n                kind = kind,\n                baseUrl = baseUrl.trim(),\n                apiKey = apiKey,\n                apiKeyRequired = apiKeyRequired,\n                headers = headers.ifBlank { "{}" },\n                selectedModels = (selected + manual).distinctBy { it.id },\n            ),\n        )\n    }\n\n    ModalBottomSheet(\n        onDismissRequest = onDismiss,\n        sheetState = sheetState,\n    ) {\n        Column(\n            modifier = Modifier\n                .fillMaxWidth()\n                .fillMaxHeight(0.94f)\n                .heightIn(max = 760.dp)\n                .imePadding(),\n        ) {\n            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 20.dp),\n                verticalArrangement = Arrangement.spacedBy(4.dp),\n            ) {\n                Text("Add provider", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.SemiBold)\n                Text(\n                    "Choose a preset or connect a custom API endpoint.",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n            }\n            Spacer(Modifier.height(12.dp))\n            Column(\n                modifier = Modifier\n                    .weight(1f)\n                    .verticalScroll(formScrollState)\n                    .padding(horizontal = 20.dp),\n                verticalArrangement = Arrangement.spacedBy(10.dp),\n            ) {\n''')

          old_tail = '''            }\n        },\n        dismissButton = { OutlinedButton(onClick = onDismiss) { Text("Cancel") } },\n        confirmButton = {\n            Button(\n                enabled = valid,\n                onClick = {\n                    val selected = discoveredModels.filter { it.id in selectedModelIds }\n                    val manual = if (manualModelReady) listOf(DiscoveredModel(manualModelId, manualModelName.trim())) else emptyList()\n                    onAdd(\n                        ProviderDraft(\n                            templateProviderId = templateId,\n                            name = name.trim(),\n                            kind = kind,\n                            baseUrl = baseUrl.trim(),\n                            apiKey = apiKey,\n                            apiKeyRequired = apiKeyRequired,\n                            headers = headers.ifBlank { "{}" },\n                            selectedModels = (selected + manual).distinctBy { it.id },\n                        ),\n                    )\n                },\n            ) { Text("Add provider") }\n        },\n    )\n}\n'''
          new_tail = '''            }\n            Spacer(Modifier.height(12.dp))\n            HorizontalDivider()\n            BoxWithConstraints(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .navigationBarsPadding()\n                    .padding(horizontal = 20.dp, vertical = 14.dp),\n            ) {\n                if (maxWidth < 360.dp) {\n                    Column(\n                        modifier = Modifier.fillMaxWidth(),\n                        verticalArrangement = Arrangement.spacedBy(8.dp),\n                    ) {\n                        Button(\n                            enabled = valid,\n                            onClick = ::submitProvider,\n                            modifier = Modifier.fillMaxWidth(),\n                        ) { Text("Add provider") }\n                        OutlinedButton(onClick = onDismiss, modifier = Modifier.fillMaxWidth()) { Text("Cancel") }\n                    }\n                } else {\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(10.dp),\n                    ) {\n                        OutlinedButton(onClick = onDismiss, modifier = Modifier.weight(1f)) { Text("Cancel") }\n                        Button(\n                            enabled = valid,\n                            onClick = ::submitProvider,\n                            modifier = Modifier.weight(1f),\n                        ) { Text("Add provider") }\n                    }\n                }\n            }\n        }\n    }\n}\n'''
          replace_once(path, old_tail, new_tail)

          replace_once(path,
              '@Composable\nprivate fun AddProviderDialog(\n',
              '@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nprivate fun AddProviderDialog(\n')

          settings = (root / path).read_text()
          add_provider = settings.split('private fun AddProviderDialog(', 1)[1].split('private fun providerKindLabel(', 1)[0]
          required = [
              'ModalBottomSheet(',
              'skipPartiallyExpanded = true',
              '.fillMaxHeight(0.94f)',
              '.imePadding()',
              '.navigationBarsPadding()',
              '.weight(1f)',
              'if (maxWidth < 360.dp)',
          ]
          for token in required:
              if token not in add_provider:
                  raise SystemExit(f'AddProviderDialog missing expected token: {token}')
          if 'heightIn(max = 590.dp)' in add_provider or 'XyluneAlertDialog(' in add_provider:
              raise SystemExit('Old fixed-height alert-dialog provider form still present')
          PY

          git diff --check
          git rm .github/workflows/fix-runtime-version-provider-sheet-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java
          git commit -m "Fix runtime version reporting and provider setup layout"
          git push origin HEAD:agent/fix-runtime-version-provider-sheet
