name: Escape Turkish completion resource apostrophes once
on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/escape-turkish-completion-apostrophes-once.yml']
permissions:
  contents: write
jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Escape apostrophes in Android resource values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'app/src/main/res/values/strings_turkish_completion.xml',
              'app/src/main/res/values-en/strings_turkish_completion.xml',
              'app/src/main/res/values-tr/strings_turkish_completion.xml',
          ]:
              p=Path(name)
              text=p.read_text()
              text=text.replace("\\'", "'").replace("'", "\\'")
              p.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/escape-turkish-completion-apostrophes-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Escape Turkish completion resource apostrophes'
          git push origin HEAD:agent/complete-turkish-localization
