name: Localization validation

on:
  push:
    branches:
      - agent/turkish-localization
    paths:
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turkish-localization
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Turkish localization test
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest --tests app.xylune.chat.ui.TurkishLocalizationTest
          status=$?
          echo '--- junit xml ---'
          cat app/build/test-results/testReleaseUnitTest/TEST-app.xylune.chat.ui.TurkishLocalizationTest.xml || true
          exit "$status"
