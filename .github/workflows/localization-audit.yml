name: Finalize localization release

on:
  push:
    branches:
      - agent/turkish-localization
    paths:
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turkish-localization
          fetch-depth: 0
      - name: Prepare 0.24.22 and remove temporary localization scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if 'versionCode = 210' not in s or 'versionName = "0.24.21"' not in s:
              raise SystemExit('unexpected current app version')
          s = s.replace('versionCode = 210', 'versionCode = 211', 1)
          s = s.replace('versionName = "0.24.21"', 'versionName = "0.24.22"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          cat > docs/releases/RELEASE_NOTES_0.24.22.md <<'EOF'
          # Xylune 0.24.22

          - Added an app-language setting with System default, English, and Türkçe.
          - Added Turkish localization across chat, settings, tools, dialogs, setup and transfer flows, widgets, and background notifications.
          - System default follows the device language, and Android's per-app language support can select Turkish independently.
          - Language selection is included in portable settings backup and restore.
          - Corrected stale UK-English branding so Xylune remains Xylune across English locales.
          EOF
          git rm -f .github/workflows/localization-audit.yml .ci/localization.patch.gz.b64 .ci/localization.patch.part.* .ci/localization.patch.rest.*
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts docs/releases/RELEASE_NOTES_0.24.22.md
          git commit -m "Prepare Xylune 0.24.22"
          git push origin HEAD:agent/turkish-localization
