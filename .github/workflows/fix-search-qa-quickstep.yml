name: Harden settings scroll QA

on:
  push:
    branches:
      - agent/integrated-settings-polish-20260813
    paths:
      - .github/workflows/fix-search-qa-quickstep.yml

permissions:
  contents: write

jobs:
  patch-clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integrated-settings-polish-20260813
      - name: Make Settings scroll resilient to emulator launcher ANRs
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('ci/android-emulator-qa.sh')
          s = p.read_text()
          old = '''    settings_ui="$OUT/settings-home-ui.xml"
              if ! pick_text_center "$settings_ui" "Search & web" >/dev/null 2>&1; then
                scroll_xy="$(python3 - "$settings_ui" <<'PY2'
          import re, sys
          data = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for tag in re.findall(r'<node\\b[^>]*>', data):
              if 'scrollable="true"' not in tag:
                  continue
              m = re.search(r'bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"', tag)
              if not m:
                  continue
              x1, y1, x2, y2 = map(int, m.groups())
              x = (x1 + x2) // 2
              print(x, y1 + (y2-y1)*3//4, x, y1 + (y2-y1)//4)
              raise SystemExit(0)
          raise SystemExit(1)
          PY2
                )" || true
                if [[ -n "$scroll_xy" ]]; then
                  read -r sx sy ex ey <<<"$scroll_xy"
                  adb shell input swipe "$sx" "$sy" "$ex" "$ey" 350
                  echo "scrollSettingsHome=PASS coord=${sx},${sy}->${ex},${ey}" >> "$OUT/qa-summary.txt"
                  sleep 2
                  capture_screen settings-home-scrolled
                  settings_ui="$OUT/settings-home-scrolled-ui.xml"
                else
                  record_failure "scrollSettingsHome=FAIL scrollable-node-not-found"
                fi
              fi
          '''
          new = '''    settings_ui="$OUT/settings-home-ui.xml"
              for scroll_attempt in 1 2 3; do
                if pick_text_center "$settings_ui" "Search & web" >/dev/null 2>&1; then
                  break
                fi
                scroll_xy="$(python3 - "$settings_ui" <<'PY2'
          import re, sys
          data = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for tag in re.findall(r'<node\\b[^>]*>', data):
              if 'scrollable="true"' not in tag:
                  continue
              m = re.search(r'bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"', tag)
              if not m:
                  continue
              x1, y1, x2, y2 = map(int, m.groups())
              x = (x1 + x2) // 2
              print(x, y1 + (y2-y1)*3//4, x, y1 + (y2-y1)//4)
              raise SystemExit(0)
          raise SystemExit(1)
          PY2
                )" || true
                if [[ -z "$scroll_xy" ]]; then
                  record_failure "scrollSettingsHome=FAIL scrollable-node-not-found attempt=$scroll_attempt"
                  break
                fi
                read -r sx sy ex ey <<<"$scroll_xy"
                adb shell input swipe "$sx" "$sy" "$ex" "$ey" 350
                echo "scrollSettingsHome=PASS attempt=$scroll_attempt coord=${sx},${sy}->${ex},${ey}" >> "$OUT/qa-summary.txt"
                sleep 2
                capture_name="settings-home-scroll-${scroll_attempt}"
                capture_screen "$capture_name"
                dismiss_quickstep_anr "$capture_name" || record_failure "settingsScrollSystemOverlayClear=FAIL attempt=$scroll_attempt"
                settings_ui="$OUT/${capture_name}-ui.xml"
              done
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one old scroll block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n ci/android-emulator-qa.sh
      - name: Publish clean QA hardening
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-search-qa-quickstep.yml
          git add ci/android-emulator-qa.sh
          git config user.name 'xylune-agent[bot]'
          git config user.email 'xylune-agent[bot]@users.noreply.github.com'
          git commit -m 'Retry Settings QA after launcher ANRs'
          git push origin HEAD:agent/integrated-settings-polish-20260813
