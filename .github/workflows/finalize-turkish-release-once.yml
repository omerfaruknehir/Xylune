name: Finalize Turkish 0.24.27 once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/finalize-turkish-release-once.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/complete-turkish-localization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Finalize Turkish UI coverage and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Localize non-Text accessibility semantics through the same UI locale layer.
          replacements = {
            'app/src/main/java/app/xylune/chat/ui/ModelPickerSheet.kt': [
              ('Icon(Icons.Outlined.Close, "Close model picker")', 'Icon(Icons.Outlined.Close, localizedXyluneUiText("Close model picker"))'),
              ('if (key in favoriteKeys) "Remove favorite" else "Add favorite",', 'localizedXyluneUiText(if (key in favoriteKeys) "Remove favorite" else "Add favorite"),'),
            ],
            'app/src/main/java/app/xylune/chat/ui/ImageGenerationUi.kt': [
              ('Icon(Icons.Filled.Stop, "Stop image generation")', 'Icon(Icons.Filled.Stop, localizedXyluneUiText("Stop image generation"))'),
              ('contentDescription = "Current generated image preview",', 'contentDescription = localizedXyluneUiText("Current generated image preview"),'),
            ],
            'app/src/main/java/app/xylune/chat/ui/SearchScreen.kt': [
              ('contentDescription = "Clear search"', 'contentDescription = localizedXyluneUiText("Clear search")'),
            ],
            'app/src/main/java/app/xylune/chat/ui/GeneratedContentRepairUi.kt': [
              ('contentDescription = "Inspect repair"', 'contentDescription = localizedXyluneUiText("Inspect repair")'),
            ],
          }
          for file, pairs in replacements.items():
            p = Path(file)
            s = p.read_text()
            for old, new in pairs:
              if old not in s:
                raise SystemExit(f'expected accessibility anchor missing: {file}: {old}')
              s = s.replace(old, new)
            p.write_text(s)

          # Finish the runtime-only strings that cannot be represented by static Android resources.
          p = Path('app/src/main/java/app/xylune/chat/ui/TurkishDynamicUiCopy.kt')
          s = p.read_text()
          exact_anchor = '''        when (text) {\n            "Thinking" -> return "Düşünme"\n'''
          exact = '''        when (text) {\n            "Close model picker" -> return "Model seçiciyi kapat"\n            "Stop image generation" -> return "Görsel oluşturmayı durdur"\n            "Inspect repair" -> return "Onarımı incele"\n            "Clear search" -> return "Aramayı temizle"\n            "• cost unavailable" -> return "• maliyet kullanılamıyor"\n            "• partial cost" -> return "• kısmi maliyet"\n            "2 on" -> return "2 etkin"\n            "Thinking" -> return "Düşünme"\n'''
          if exact_anchor not in s:
            raise SystemExit('exact Turkish dynamic anchor missing')
          s = s.replace(exact_anchor, exact, 1)

          provider_anchor = '''        Regex("""(\\d+) starred""").matchEntire(text)?.let { return "${it.groupValues[1]} favori" }\n'''
          if provider_anchor not in s:
            raise SystemExit('provider-count anchor missing')
          s = s.replace(provider_anchor, provider_anchor + '''        Regex("""(\\d+) configured providers?""").matchEntire(text)?.let { return "${it.groupValues[1]} yapılandırılmış sağlayıcı" }\n''', 1)

          composite_anchor = '''        // Technical summaries are assembled from independently localizable UI segments.\n'''
          if composite_anchor not in s:
            raise SystemExit('composite Turkish dynamic anchor missing')
          residual = r'''        Regex("""Configured as (.+) • tap to check backups""").matchEntire(text)?.let {
            return "${it.groupValues[1]} olarak yapılandırıldı • yedekleri kontrol etmek için dokunun"
        }
        Regex("""(\d+) chats? • (\d+) messages • (\d+) attachments?(?: • (\d+) Linux environments?)?""").matchEntire(text)?.let {
            val linux = it.groupValues[4].takeIf(String::isNotBlank)?.let { count -> " • $count Linux ortamı" }.orEmpty()
            return "${it.groupValues[1]} sohbet • ${it.groupValues[2]} mesaj • ${it.groupValues[3]} ek$linux"
        }
        Regex("""Created by Xylune (.+) • (encrypted|not encrypted)""").matchEntire(text)?.let {
            val state = if (it.groupValues[2] == "encrypted") "şifreli" else "şifrelenmemiş"
            return "Xylune ${it.groupValues[1]} tarafından oluşturuldu • $state"
        }
        Regex("""Call (\d+) · round (\d+)""").matchEntire(text)?.let { return "Çağrı ${it.groupValues[1]} · tur ${it.groupValues[2]}" }
        Regex("""input (\d+) · cached (\d+) · output (\d+)""").matchEntire(text)?.let {
            return "girdi ${it.groupValues[1]} · önbellek ${it.groupValues[2]} · çıktı ${it.groupValues[3]}"
        }
        Regex("""non-cached (\d+) · total (\d+)""").matchEntire(text)?.let { return "önbelleksiz ${it.groupValues[1]} · toplam ${it.groupValues[2]}" }
        Regex("""(.+) is running in the background • (\d+)s deadline""").matchEntire(text)?.let {
            return "${it.groupValues[1]} arka planda çalışıyor • ${it.groupValues[2]} sn süre sınırı"
        }
        Regex("""(.+) simulates the complete transaction first and checks what is already installed before approval\.""").matchEntire(text)?.let {
            return "${it.groupValues[1]} önce işlemin tamamını simüle eder ve onaydan önce nelerin zaten yüklü olduğunu kontrol eder."
        }
        Regex("""Installed and import-verified (.+)""").matchEntire(text)?.let { return "Yüklendi ve içe aktarım doğrulandı: ${it.groupValues[1]}" }
        Regex("""(.+) → import (.+)""").matchEntire(text)?.let { return "${it.groupValues[1]} → içe aktarım ${it.groupValues[2]}" }
        Regex("""GPU (.+) ms  Miss/s (.+)  Reports (.+)""").matchEntire(text)?.let {
            return "GPU ${it.groupValues[1]} ms  Kaçırma/sn ${it.groupValues[2]}  Rapor ${it.groupValues[3]}"
        }
        Regex("""FM (.+)  L (.+)  D (.+)  Cmd (.+)  Sw (.+)""").matchEntire(text)?.let {
            return "FM ${it.groupValues[1]}  Yerleşim ${it.groupValues[2]}  Çizim ${it.groupValues[3]}  Komut ${it.groupValues[4]}  Takas ${it.groupValues[5]}"
        }
        Regex("""BlurCPU (.+)  (.+) MP/s  srcTrav×(.+) replay×(.+)""").matchEntire(text)?.let {
            return "BulanıklıkCPU ${it.groupValues[1]}  ${it.groupValues[2]} MP/sn  kaynakGez×${it.groupValues[3]} tekrar×${it.groupValues[4]}"
        }
        Regex("""cap/s (.+) fx/s (.+)  levels D(.+)/U(.+)""").matchEntire(text)?.let {
            return "yakalama/sn ${it.groupValues[1]} efekt/sn ${it.groupValues[2]}  düzeyler A${it.groupValues[3]}/Y${it.groupValues[4]}"
        }
'''
          s = s.replace(composite_anchor, residual + composite_anchor, 1)
          p.write_text(s)

          # Patch release version and its regression test.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          for old, new in [
            ('versionCode = 215', 'versionCode = 216'),
            ('versionName = "0.24.26"', 'versionName = "0.24.27"'),
          ]:
            if old not in s:
              raise SystemExit(f'version anchor missing: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/test/java/app/xylune/chat/ReleaseVersionRegressionTest.kt')
          s = p.read_text()
          replacements = [
            ('release metadata is scoped to 0_24_26', 'release metadata is scoped to 0_24_27'),
            ('RELEASE_NOTES_0.24.26.md', 'RELEASE_NOTES_0.24.27.md'),
            ('versionCode = 215', 'versionCode = 216'),
            ('versionName = \\"0.24.26\\"', 'versionName = \\"0.24.27\\"'),
            ('# Xylune 0.24.26', '# Xylune 0.24.27'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'release regression anchor missing: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY

          mkdir -p docs/releases/tr
          cat > docs/releases/RELEASE_NOTES_0.24.27.md <<'EOF'
          # Xylune 0.24.27

          ## Complete Turkish UI coverage

          - Completes Turkish localization across the model picker, update controls, developer/performance settings, backup and transfer flows, local execution, image generation, generated-content repair, and other Xylune-owned UI copy found by a source-wide audit.
          - Translates runtime-formatted model counts and capability summaries such as context/output limits, Thinking, Tools, queue counts, update repository/status text, provider/model metadata, package/runtime progress, and performance diagnostics while preserving model names, provider names, URLs, file names, code, and user/model content verbatim.
          - Makes static missing copy resource-backed in Android English/Turkish locale resources instead of expanding the legacy exact-string translation maps.
          - Normalizes leading/trailing layout whitespace before localization, fixing icon-prefixed controls such as “Check for updates” without duplicating translations.
          - Extends the locale layer to accessibility semantics used by model selection, image generation, search, and generated-content repair.
          - Adds resource-parity and dynamic-format regression tests, including the model-picker and update strings reported from 0.24.26.
          EOF

          cat > docs/releases/tr/RELEASE_NOTES_0.24.27.md <<'EOF'
          # Xylune 0.24.27

          ## Tam Türkçe arayüz kapsamı

          - Kaynak genelinde yapılan denetimde bulunan model seçici, güncelleme kontrolleri, geliştirici/performans ayarları, yedekleme ve aktarım akışları, yerel çalıştırma, görsel oluşturma, oluşturulan içerik onarımı ve diğer Xylune arayüz metinlerinin Türkçe çevirisini tamamlar.
          - Bağlam/çıktı sınırları, Düşünme, Araçlar, sıra sayıları, güncelleme deposu/durumu, sağlayıcı-model üst verileri, paket/çalışma zamanı ilerlemesi ve performans tanılamaları gibi çalışma anında oluşturulan metinleri çevirir; model ve sağlayıcı adlarını, URL'leri, dosya adlarını, kodu ve kullanıcı/yapay zekâ içeriğini olduğu gibi korur.
          - Eksik sabit metinleri eski tam metin eşleştirme tablolarını büyütmek yerine Android İngilizce/Türkçe kaynaklarına taşır.
          - Yerelleştirmeden önce yerleşim amaçlı baştaki/sondaki boşlukları ayırarak “Güncellemeleri kontrol et” gibi simgeli kontrollerin çeviriyi kaçırmasını önler.
          - Model seçimi, görsel oluşturma, arama ve oluşturulan içerik onarımındaki erişilebilirlik açıklamalarını da yerelleştirme katmanına dahil eder.
          - 0.24.26'da bildirilen model seçici ve güncelleme metinleri dahil olmak üzere kaynak eşitliği ve dinamik biçimlendirme için gerileme testleri ekler.
          EOF

          rm .github/workflows/finalize-turkish-release-once.yml
          git diff --check
      - name: Commit finalized release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Turkish localization and prepare 0.24.27'
          git push origin HEAD:agent/complete-turkish-localization
