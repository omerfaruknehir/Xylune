name: Prepare Xylune 0.24.28 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-0.24.28-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare 0.24.28
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          old_code = '        versionCode = 216'
          old_name = '        versionName = "0.24.27"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Expected 0.24.27/versionCode 216 exactly once')
          gradle.write_text(
              text.replace(old_code, '        versionCode = 217', 1)
                  .replace(old_name, '        versionName = "0.24.28"', 1)
          )

          Path('docs/releases/RELEASE_NOTES_0.24.28.md').write_text('''# Xylune 0.24.28

## Thinking control polish

- Completes Turkish localization for the new-conversation title and every thinking-level explanation shown by the composer.
- Removes the redundant instruction telling users how to release a slider.
- Makes supported thinking levels feel magnetic while dragging: nearby detents exert a smooth attraction instead of an instant snap, while release still settles cleanly onto the nearest supported level.
- Keeps continuous sliders continuous and limits magnetic behavior to the thinking-level control.
- Adds regression coverage for the magnetic attraction curve, the composer behavior, and English/Turkish resource parity.
''')
          PY
          rm -f .github/workflows/prepare-0.24.28-once.yml
          git diff --check

      - name: Commit and push release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xylune-release-prep[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Xylune 0.24.28'
          git push origin HEAD:main
