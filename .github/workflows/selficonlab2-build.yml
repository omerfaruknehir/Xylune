name: Build Final Self-Updating Icon Lab

on:
  push:
    branches: [icon-self-update-v3]
    paths:
      - 'selficonlab2/**'
      - '.github/workflows/selficonlab2-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-self-update-v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare persistent embedded signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selficonlab2/signing selficonlab2/app/src/main/assets selficonlab2-dist
          if [ -f selficonlab2-dist/selfsign.p12 ]; then
            cp selficonlab2-dist/selfsign.p12 selficonlab2/signing/selfsign.p12
          elif [ -f selficonlab-dist/selfsign.p12 ]; then
            cp selficonlab-dist/selfsign.p12 selficonlab2/signing/selfsign.p12
          else
            keytool -genkeypair -alias iconlab -keyalg RSA -keysize 2048 -validity 36500 \
              -dname 'CN=Icon Lab Self Update, O=Test Only, C=TR' -storetype PKCS12 \
              -keystore selficonlab2/signing/selfsign.p12 -storepass iconlab-test-only -keypass iconlab-test-only -noprompt
          fi
          cp selficonlab2/signing/selfsign.p12 selficonlab2/app/src/main/assets/selfsign.p12

      - name: Generate initial adaptive foreground
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selficonlab2/app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          import struct,zlib
          W=H=432; rows=[]
          for y in range(H):
              row=bytearray([0])
              for x in range(W):
                  dx=(x-W/2)/(W/2); dy=(y-H/2)/(H/2); r=dx*dx+dy*dy
                  c=(126,82,113,255) if r<.56 else ((214,180,203,255) if r<.72 else (0,0,0,0))
                  row.extend(c)
              rows.append(bytes(row))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
          open('selficonlab2/app/src/main/res/mipmap-xxxhdpi/icon_foreground.png','wb').write(data)
          PY

      - name: Build final APK
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew -p selficonlab2 :app:assembleDebug --stacktrace > /tmp/iconlab2.log 2>&1
          code=$?
          set -e
          cat /tmp/iconlab2.log
          mkdir -p selficonlab2-dist
          cp /tmp/iconlab2.log selficonlab2-dist/build.log
          printf 'result=%s\nsource=%s\nrun=%s\n' "$([ "$code" = 0 ] && echo success || echo failure)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > selficonlab2-dist/status.txt
          if [ "$code" = 0 ]; then
            cp selficonlab2/app/build/outputs/apk/debug/app-debug.apk selficonlab2-dist/IconLab-self-update-final.apk
            cp selficonlab2/signing/selfsign.p12 selficonlab2-dist/selfsign.p12
          fi
          exit "$code"

      - name: Upload final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: icon-lab-self-update-final
          path: selficonlab2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish result
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f selficonlab2-dist/status.txt selficonlab2-dist/build.log
          if [ -f selficonlab2-dist/IconLab-self-update-final.apk ]; then
            git add -f selficonlab2-dist/IconLab-self-update-final.apk selficonlab2-dist/selfsign.p12
          fi
          git commit -m 'Publish final self Icon Lab build result' || exit 0
          git push origin HEAD:icon-self-update-v3
