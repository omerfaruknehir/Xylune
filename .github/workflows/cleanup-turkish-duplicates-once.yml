name: One-shot Turkish copy cleanup

on:
  push:
    branches: [agent/cleanup-architecture-release]
    paths: ['.github/workflows/cleanup-turkish-duplicates-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cleanup-architecture-release
      - name: Remove duplicate branches
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/app/xylune/chat/ui/TurkishUiCopy.kt')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ('        "Custom provider" -> "Özel sağlayıcı"\n        "Provider name" -> "Sağlayıcı adı"\n        "API base URL" -> "API temel URL\'si"\n',
               '        "Custom provider" -> "Özel sağlayıcı"\n        "API base URL" -> "API temel URL\'si"\n'),
              ('        "An external page linked from this answer." -> "Bu yanıttan bağlantı verilen harici bir sayfa."\n        "Image generation" -> "Görsel oluşturma"\n        "Generate image" -> "Görsel oluştur"\n',
               '        "An external page linked from this answer." -> "Bu yanıttan bağlantı verilen harici bir sayfa."\n        "Generate image" -> "Görsel oluştur"\n'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one duplicate-copy anchor, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-turkish-duplicates-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove duplicate Turkish copy branches'
          git push origin HEAD:agent/cleanup-architecture-release
