name: Apply tested agent patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/agent-apply-tested-patch.yml'
      - 'ci/agent-apply-tested-patch.py'
      - 'ci/.agent-payload/**'

permissions:
  contents: write

concurrency:
  group: agent-context-http-foundations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/context-http-foundations'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply exact patch validated in the persistent runner
        run: python3 ci/agent-apply-tested-patch.py
      - name: Verify unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest
      - name: Replace staging payload with clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git reset
          git rm -rf ci/.agent-payload ci/agent-apply-tested-patch.py .github/workflows/agent-apply-tested-patch.yml
          git add -A
          git config user.name 'xylune-agent[bot]'
          git config user.email 'xylune-agent[bot]@users.noreply.github.com'
          git commit -m 'Add HTTP API and conversation retrieval foundations'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
