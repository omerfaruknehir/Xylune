name: One-shot 0.24.22 version bump

on:
  push:
    branches:
      - agent/fix-source-preview-turkish-localization

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-source-preview-turkish-localization
          fetch-depth: 0
      - name: Bump Android version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = '        versionCode = 210\n        versionName = "0.24.21"'
          new = '        versionCode = 211\n        versionName = "0.24.22"'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected 0.24.21 version block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/build.gradle.kts; then
            echo "Version already bumped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump version to 0.24.22"
          git push origin HEAD:agent/fix-source-preview-turkish-localization
