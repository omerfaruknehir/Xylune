name: Cleanup one-shot version bump

on:
  push:
    branches:
      - agent/fix-source-preview-turkish-localization

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-source-preview-turkish-localization
          fetch-depth: 0
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-release-version-once.yml
          git commit -m "Remove temporary version bump workflow"
          git push origin HEAD:agent/fix-source-preview-turkish-localization
