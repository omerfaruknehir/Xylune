name: Fix provider sheet and model picker once

on:
  push:
    branches:
      - agent/fix-provider-sheet-model-picker
    paths:
      - tools/fix_provider_sheet_model_picker_once.py
      - .github/workflows/fix-provider-sheet-model-picker-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/fix_provider_sheet_model_picker_once.py
      - name: Remove one-shot files
        run: |
          rm tools/fix_provider_sheet_model_picker_once.py
          rm .github/workflows/fix-provider-sheet-model-picker-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix provider sheet scrolling and model picker motion"
          git push
