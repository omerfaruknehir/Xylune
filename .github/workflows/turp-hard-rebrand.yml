name: Stage final Turp workflow rewrites

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-workflows:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/turp-hard-rename
          fetch-depth: 0

      - name: Generate exact Turp workflow copies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = (
              ('XYLUNE', 'TURP'),
              ('Xylune', 'Turp'),
              ('xylune', 'turp'),
          )
          names = (
              'android.yml',
              'pages.yml',
              'release-notes-i18n.yml',
              'wip-android-qa.yml',
              'wip-debug-apk.yml',
          )
          output = Path('.turp-workflow-staging')
          output.mkdir(exist_ok=True)
          for name in names:
              source = Path('.github/workflows') / name
              text = source.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              assert all(old not in text for old, _ in replacements), name
              (output / f'{name}.txt').write_text(text, encoding='utf-8')
              print(f'staged {name}')
          PY

      - name: Commit staged workflow copies
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .turp-workflow-staging
          if git diff --cached --quiet; then
            echo 'Workflow staging already current.'
            exit 0
          fi
          git commit -m 'Stage final Turp workflow rewrites'
          git push origin HEAD:rebrand/turp-hard-rename
