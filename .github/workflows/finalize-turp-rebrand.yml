name: Finalize Turp rebrand and provider backup

on:
  push:
    branches:
      - agent/integrated-settings-polish-20260813
    paths:
      - .github/workflows/finalize-turp-rebrand.yml

permissions:
  contents: write

concurrency:
  group: finalize-turp-rebrand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/integrated-settings-polish-20260813

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply final changes
        run: |
          python3 ci/finalize_turp.py
          python3 ci/finalize_turp_followup.py
          python3 ci/finalize_turp_last.py
          python3 ci/finalize_turp_sitefix.py
          python3 ci/finalize_turp_release_names.py
          python3 ci/finalize_turp_ci_fixes.py
          python3 - <<'PY'
          from pathlib import Path

          palettes = {
              "graphite": ("#FFA9C7F8", "#FFE7F0FF", "#FFE5BFA6"),
              "ocean": ("#FF54D6F2", "#FFD5F7FF", "#FFBEC6EA"),
              "violet": ("#FFD1BCFF", "#FFF0E8FF", "#FFEFB8C8"),
              "sunset": ("#FFFFB59C", "#FFFFEDE7", "#FFD7C58D"),
          }
          leaf_starts = ("#FF78BF43", "#FF80C442")
          leaf_ends = ("#FF3A8331", "#FF338331", "#FF24782D", "#FF367F31", "#FF5CA735", "#FF3F8E31")
          bulb_colors = ("#FFE51F47", "#FFFF385D", "#FFDB2449", "#FFC91A40", "#FFEA4668")

          for directory in (Path("app/src/main/res/drawable"), Path("app/src/main/res/drawable-v31")):
              if not directory.exists():
                  continue
              for suffix, (leaf_start, leaf_end, bulb) in palettes.items():
                  for prefix in ("ic_xylune_foreground_", "ic_xylune_mark_"):
                      path = directory / f"{prefix}{suffix}.xml"
                      if not path.exists():
                          continue
                      text = path.read_text()
                      for color in leaf_starts:
                          text = text.replace(color, leaf_start)
                      for color in leaf_ends:
                          text = text.replace(color, leaf_end)
                      for color in bulb_colors:
                          text = text.replace(color, bulb)
                      path.write_text(text)

          test = Path("app/src/test/java/app/xylune/chat/ui/TurpDynamicIconPaletteTest.kt")
          test.write_text('''package app.xylune.chat.ui

          import java.io.File
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class TurpDynamicIconPaletteTest {
              @Test
              fun `Turp launcher geometry keeps every static palette distinct`() {
                  val expected = mapOf(
                      "graphite" to listOf("#FFA9C7F8", "#FFE5BFA6"),
                      "ocean" to listOf("#FF54D6F2", "#FFBEC6EA"),
                      "violet" to listOf("#FFD1BCFF", "#FFEFB8C8"),
                      "sunset" to listOf("#FFFFB59C", "#FFD7C58D"),
                  )
                  expected.forEach { (name, colors) ->
                      val source = File("src/main/res/drawable/ic_xylune_foreground_${'$'}name.xml").readText()
                      assertTrue(name, source.contains("M734,681"))
                      colors.forEach { color -> assertTrue("${'$'}name missing ${'$'}color", source.contains(color)) }
                  }
              }
          }
          ''')
          PY

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'initialTemplateId = addingProviderTemplateId' app/src/main/java/app/xylune/chat/ui/SettingsScreen.kt
          grep -F 'templates = DefaultCatalog.providers.filter' app/src/main/java/app/xylune/chat/ui/SettingsScreen.kt
          grep -F 'fun matchesPresetId(providerId: String?, presetId: String)' app/src/main/java/app/xylune/chat/provider/ModelRequestPolicy.kt
          grep -F 'ModelRequestPolicy.matchesPresetId(provider?.id, "openrouter")' app/src/main/java/app/xylune/chat/provider/ThinkingCapabilities.kt
          grep -F 'ModelRequestPolicy.matchesPresetId(providerId, "openai")' app/src/main/java/app/xylune/chat/provider/ThinkingCapabilities.kt
          grep -F 'includeApiKeys: Boolean = false' app/src/main/java/app/xylune/chat/transfer/XyluneArchiveManager.kt
          grep -F 'API keys require a password-encrypted backup' app/src/main/java/app/xylune/chat/transfer/XyluneArchiveManager.kt
          grep -F '<string name="app_name">Turp</string>' app/src/main/res/values/strings.xml
          grep -F 'applicationId = "app.xylune.chat"' app/build.gradle.kts
          grep -F 'baseurl: /Xylune' docs/_config.yml
          grep -F 'repository: omerfaruknehir/Xylune' docs/_config.yml
          grep -F 'M734,681' app/src/main/res/drawable/ic_xylune_foreground.xml
          grep -F '#FFA9C7F8' app/src/main/res/drawable/ic_xylune_foreground_graphite.xml
          grep -F '#FF54D6F2' app/src/main/res/drawable/ic_xylune_foreground_ocean.xml
          grep -F '#FFD1BCFF' app/src/main/res/drawable/ic_xylune_foreground_violet.xml
          grep -F '#FFFFB59C' app/src/main/res/drawable/ic_xylune_foreground_sunset.xml
          grep -F '@android:color/system_accent1_200' app/src/main/res/drawable-v31/ic_xylune_foreground_system.xml
          grep -F '@android:color/system_accent3_200' app/src/main/res/drawable-v31/ic_xylune_foreground_system.xml
          grep -F '@android:color/system_accent1_800' app/src/main/res/drawable-v31/ic_xylune_mark_system.xml
          grep -F 'branding/turp-banner.svg' README.md
          grep -F 'home-hero__backdrop--turp' docs/index.html
          grep -F 'M734 681' docs/assets/js/logo-motion.js
          ! grep -F 'M33.549193' docs/assets/js/logo-motion.js
          grep -F 'apk="Turp-${XYLUNE_VERSION}-release.apk"' .github/workflows/android.yml
          grep -F -- '--title "Turp ${XYLUNE_VERSION}"' .github/workflows/android.yml
          grep -F 'apk="Turp-PR-${pr}-${short_sha}-debug.apk"' .github/workflows/wip-debug-apk.yml
          grep -F 'XyluneProgramRuntime.render' app/src/main/java/app/xylune/chat/widgets/ProgramBlocks.kt
          grep -F 'english.startsWith("# Xylune 0.24.28")' app/src/test/java/app/xylune/chat/ReleaseVersionRegressionTest.kt
          grep -F '<si><t>Xylune</t></si>' app/src/test/java/app/xylune/chat/files/OfficeDocumentExtractorTest.kt

      - name: Build test and lint
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Publish clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-turp-rebrand.yml ci/finalize_turp.py ci/finalize_turp_followup.py ci/finalize_turp_last.py ci/finalize_turp_sitefix.py ci/finalize_turp_release_names.py ci/finalize_turp_ci_fixes.py
          git add -A
          git config user.name 'xylune-agent[bot]'
          git config user.email 'xylune-agent[bot]@users.noreply.github.com'
          git commit -m 'Rebrand Xylune to Turp and support reusable provider presets'
          git push origin HEAD:agent/integrated-settings-polish-20260813
