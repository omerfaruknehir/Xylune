name: Turkish residual audit once
on:
  push:
    branches: [agent/complete-turkish-localization]
    paths: ['.github/workflows/turkish-residual-audit-once.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-turkish-localization
      - name: Find residual likely visible strings
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, re
          from pathlib import Path
          root=Path('app/src/main/java/app/xylune/chat/ui')
          coverage_paths=[
            root/'UiStringResources.kt', root/'TurkishCompletionResources.kt',
            root/'TurkishUiCopy.kt', root/'TurkishUiCopyExtra.kt', root/'TurkishUiCopyExtra2.kt', root/'TurkishUiCopyExtra3.kt',
            root/'TurkishDynamicUiCopy.kt',
          ]
          coverage='\n'.join(p.read_text() for p in coverage_paths if p.exists())
          q=re.compile(r'(?s)(""".*?"""|"(?:\\.|[^"\\])*")')
          static_markers=('Text(', 'SettingsGroup(', 'SettingsSwitch(', 'SettingsDestination(', 'title =', 'subtitle =', 'label =', 'placeholder =', 'supportingText')
          accessibility_markers=('contentDescription', 'Icon(', 'Image(')
          static=[]; dynamic=[]; accessibility=[]
          for path in sorted(root.glob('*.kt')):
            if path in coverage_paths: continue
            text=path.read_text()
            for m in q.finditer(text):
              raw=m.group(0)
              try: value=raw[3:-3] if raw.startswith('"""') else ast.literal_eval(raw)
              except Exception: continue
              value=value.strip()
              if not value or len(value)>500 or not re.search(r'[A-Za-z]{2,}',value): continue
              if any(x in value for x in ('UUID.randomUUID','context.packageName','message.nodeId','stateKey','messageKey','runId')): continue
              before=text[max(0,m.start()-500):m.start()]
              line=text.count('\n',0,m.start())+1
              rec=f'{path.name}:{line}: {value.replace(chr(10)," ↩ ")}'
              if any(x in before[-250:] for x in accessibility_markers) and '$' not in value and value not in coverage:
                accessibility.append(rec)
              if any(x in before for x in static_markers):
                if ('$' in value or '${' in value):
                  # Dynamic coverage is heuristic: literal phrase fragments represented in translator count as covered.
                  words=[w for w in re.findall(r'[A-Za-z]{3,}', re.sub(r'\$\{.*?\}|\$[A-Za-z_][A-Za-z0-9_]*','',value)) if w.lower() not in {'the','and','for','with'}]
                  if words and not any(' '.join(words[:min(len(words),4)]) in coverage for _ in [0]):
                    dynamic.append(rec)
                elif value not in coverage:
                  if not (re.fullmatch(r'[A-Za-z0-9_.:+/-]+', value) and ' ' not in value):
                    static.append(rec)
          out=['# Residual likely-visible Turkish gaps','', '## Static',*sorted(set(static)),'','## Dynamic templates',*sorted(set(dynamic)),'','## Accessibility literals',*sorted(set(accessibility)),'']
          Path('translation-residual-audit.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm .github/workflows/turkish-residual-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit residual Turkish UI gaps'
          git push origin HEAD:agent/complete-turkish-localization
