name: Apply runtime version and provider sheet patch from PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-runtime-version-provider-sheet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-runtime-version-provider-sheet
          fetch-depth: 0
      - name: Apply production patch and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_runtime_version_provider_sheet_once.py
          git diff --check
          git rm \
            .github/workflows/fix-runtime-version-provider-sheet-once.yml \
            .github/workflows/fix-runtime-version-provider-sheet-pr-once.yml \
            .github/runtime-version-provider-sheet-trigger \
            tools/fix_runtime_version_provider_sheet_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java
          git commit -m "Fix runtime version reporting and provider setup layout"
          git push origin HEAD:agent/fix-runtime-version-provider-sheet
